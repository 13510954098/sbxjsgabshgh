name: Discover Animeko Source Ecosystem

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - src/animeko_url_policy.py
      - src/discover_animeko.py
      - src/promote_discovery.py
      - src/publish_discovery.py
      - src/update_sources.py
      - src/requirements-discovery.lock
      - discovery/seeds.txt
      - discovery/trusted_programs.txt
      - .github/workflows/discover.yml

concurrency:
  group: discover-animeko-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve_review:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_open: ${{ steps.review.outputs.has_open }}
      number: ${{ steps.review.outputs.number }}
      branch: ${{ steps.review.outputs.branch }}
      head_sha: ${{ steps.review.outputs.head_sha }}

    steps:
      - name: Resolve the single rolling discovery pull request
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REVIEW_LIST: ${{ runner.temp }}/animeko-rolling-reviews.json
        run: |
          set -euo pipefail
          gh pr list \
            --repo "$GH_REPO" \
            --state open \
            --base "${{ github.event.repository.default_branch }}" \
            --limit 100 \
            --json number,headRefName,headRefOid,headRepositoryOwner \
            > "$REVIEW_LIST"
          python - "$REVIEW_LIST" "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import re
          import sys

          reviews = json.load(open(sys.argv[1], encoding="utf-8"))
          owner = os.environ["REPOSITORY_OWNER"]
          matches = []
          for review in reviews:
              head_owner = (review.get("headRepositoryOwner") or {}).get("login")
              branch = review.get("headRefName", "")
              if head_owner == owner and branch.startswith("automation/animeko-review-"):
                  matches.append(review)
          if len(matches) > 1:
              raise SystemExit("检测到多个滚动Discovery PR，拒绝选择不确定基线")
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              if not matches:
                  output.write("has_open=false\nnumber=\nbranch=\nhead_sha=\n")
              else:
                  review = matches[0]
                  branch = review["headRefName"]
                  head = review["headRefOid"]
                  if not re.fullmatch(r"automation/animeko-review-[0-9]+-[0-9]+", branch):
                      raise SystemExit("滚动Discovery PR分支名无效")
                  if not re.fullmatch(r"(?:[0-9a-f]{40}|[0-9a-f]{64})", head):
                      raise SystemExit("滚动Discovery PR Head SHA无效")
                  output.write(
                      f"has_open=true\nnumber={review['number']}\n"
                      f"branch={branch}\nhead_sha={head}\n")
          PY

  discover:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: resolve_review
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned discovery dependencies
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r src/requirements-discovery.lock
          python - <<'PY'
          import requests
          import urllib3
          assert requests.__version__ == "2.34.2", requests.__version__
          assert urllib3.__version__ == "2.7.0", urllib3.__version__
          PY

      - name: Compile discovery code
        run: python -m py_compile src/animeko_url_policy.py src/discover_animeko.py src/update_sources.py

      - name: Run discovery selftests
        run: python src/discover_animeko.py --test

      - name: Run updater security selftests
        run: python src/update_sources.py --test

      - name: Discover with read-only GitHub token
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/discover_animeko.py --discover

      - name: Validate discovery output
        run: python src/discover_animeko.py --validate-state

      - name: Stage fixed raw artifact
        env:
          RAW_STAGE: ${{ runner.temp }}/animeko-raw-upload
        run: |
          set -euo pipefail
          rm -rf "$RAW_STAGE"
          mkdir "$RAW_STAGE"
          install -m 0644 \
            discovery/latest.json \
            discovery/programs.json \
            discovery/candidates.json \
            discovery/redundant.json \
            discovery/rejected.json \
            "$RAW_STAGE/"
          test "$(find "$RAW_STAGE" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 5
          test "$(find "$RAW_STAGE" -mindepth 1 -maxdepth 1 | wc -l)" -eq 5

      - name: Upload raw observations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: animeko-raw-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/animeko-raw-upload/
          if-no-files-found: error
          overwrite: false
          retention-days: 3

  sanitize:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [discover, resolve_review]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout trusted sanitizer without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay cumulative state from the rolling review
        if: needs.resolve_review.outputs.has_open == 'true'
        env:
          REVIEW_BRANCH: ${{ needs.resolve_review.outputs.branch }}
          REVIEW_HEAD: ${{ needs.resolve_review.outputs.head_sha }}
          OVERLAY: ${{ runner.temp }}/animeko-review-baseline
        run: |
          set -euo pipefail
          [[ "$REVIEW_BRANCH" =~ ^automation/animeko-review-[0-9]+-[0-9]+$ ]]
          [[ "$REVIEW_HEAD" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          git fetch --no-tags --depth=1 origin "+refs/heads/$REVIEW_BRANCH:refs/remotes/origin/animeko-rolling-review"
          test "$(git rev-parse refs/remotes/origin/animeko-rolling-review)" = "$REVIEW_HEAD"
          rm -rf "$OVERLAY"
          mkdir -p "$OVERLAY"
          for path in discovery/state.json discovery/programs.json; do
            entry=$(git ls-tree "$REVIEW_HEAD" -- "$path")
            [[ "$entry" == "100644 blob "* ]] || {
              echo "滚动PR基线文件mode或类型无效: $path"
              exit 1
            }
            output="$OVERLAY/${path##*/}"
            git show "$REVIEW_HEAD:$path" > "$output"
            test -s "$output"
            test "$(stat -c %s -- "$output")" -le 5242880
            install -m 0644 "$output" "$path"
          done

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Download raw observations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: animeko-raw-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/animeko-raw-observations

      - name: Compile and test trusted sanitizer
        run: |
          set -euo pipefail
          python -I -S -B -m py_compile src/animeko_url_policy.py src/promote_discovery.py src/publish_discovery.py
          python -I -S -B src/promote_discovery.py --test
          python -I -S -B src/publish_discovery.py --test

      - name: Prepare isolated sanitizer filesystem
        env:
          SANDBOX: /tmp/animeko-sanitize-${{ github.run_id }}-${{ github.run_attempt }}
          RAW_DOWNLOAD: ${{ runner.temp }}/animeko-raw-observations
        run: |
          set -euo pipefail
          sudo rm -rf -- "$SANDBOX"
          mkdir -p "$SANDBOX/baseline/discovery" "$SANDBOX/trusted" "$SANDBOX/work" "$SANDBOX/raw"
          check_regular_file() {
            local file=$1
            local maximum=$2
            test -e "$file"
            test ! -L "$file"
            test -f "$file"
            test ! -x "$file"
            test "$(stat -c %s -- "$file")" -le "$maximum"
          }
          check_regular_file src/promote_discovery.py 1048576
          check_regular_file src/animeko_url_policy.py 1048576
          cp --no-dereference -- src/promote_discovery.py src/animeko_url_policy.py "$SANDBOX/trusted/"
          chmod 0555 "$SANDBOX/trusted"
          chmod 0444 "$SANDBOX/trusted/promote_discovery.py" "$SANDBOX/trusted/animeko_url_policy.py"
          check_regular_file all_animeko_links.txt 1048576
          check_regular_file discovery/seeds.txt 65536
          check_regular_file discovery/trusted_programs.txt 65536
          cp --no-dereference -- all_animeko_links.txt "$SANDBOX/baseline/all_animeko_links.txt"
          cp --no-dereference -- discovery/seeds.txt discovery/trusted_programs.txt "$SANDBOX/baseline/discovery/"
          if [ -e discovery/state.json ] || [ -L discovery/state.json ]; then
            check_regular_file discovery/state.json 5242880
            cp --no-dereference -- discovery/state.json "$SANDBOX/baseline/discovery/state.json"
          else
            printf '%s\n' '{"version":2,"candidates":{},"promoted":[]}' > "$SANDBOX/baseline/discovery/state.json"
          fi
          if [ -e discovery/programs.json ] || [ -L discovery/programs.json ]; then
            check_regular_file discovery/programs.json 5242880
            cp --no-dereference -- discovery/programs.json "$SANDBOX/baseline/discovery/programs.json"
          else
            printf '%s\n' '{"version":1,"updated":"1970-01-01T00:00:00Z","programs":[]}' > "$SANDBOX/baseline/discovery/programs.json"
          fi
          find "$SANDBOX/baseline" -type d -exec chmod 0555 {} +
          find "$SANDBOX/baseline" -type f -exec chmod 0444 {} +
          sudo chown 65534:65534 "$SANDBOX/work"
          sudo chmod 0711 "$SANDBOX/work"
          test -d "$RAW_DOWNLOAD"
          for name in latest.json programs.json candidates.json redundant.json rejected.json; do
            test -f "$RAW_DOWNLOAD/$name"
            test ! -L "$RAW_DOWNLOAD/$name"
          done
          test "$(find "$RAW_DOWNLOAD" -mindepth 1 -maxdepth 1 | wc -l)" -eq 5
          if find "$RAW_DOWNLOAD" -mindepth 1 \( ! -type f -o -type l \) -print -quit | grep -q .; then
            echo "raw artifact仅允许五个普通文件"
            exit 1
          fi
          for name in latest.json programs.json candidates.json redundant.json rejected.json; do
            cp --no-dereference -- "$RAW_DOWNLOAD/$name" "$SANDBOX/raw/$name"
          done
          chmod 0444 "$SANDBOX/raw/"*.json
          chmod 0555 "$SANDBOX/raw"

      - name: Sanitize in offline PID and network namespace
        working-directory: /tmp/animeko-sanitize-${{ github.run_id }}-${{ github.run_attempt }}/work
        env:
          RAW_INPUT: /tmp/animeko-sanitize-${{ github.run_id }}-${{ github.run_attempt }}/raw
          BASELINE: /tmp/animeko-sanitize-${{ github.run_id }}-${{ github.run_attempt }}/baseline
          SANITIZED_OUTPUT: /tmp/animeko-sanitize-${{ github.run_id }}-${{ github.run_attempt }}/work/output
          PROMOTER: /tmp/animeko-sanitize-${{ github.run_id }}-${{ github.run_attempt }}/trusted/promote_discovery.py
        run: |
          set -euo pipefail
          PYTHON_BIN=$(command -v python)
          sudo unshare --net --pid --fork --mount-proc \
            /usr/bin/setpriv \
              --reuid=65534 \
              --regid=65534 \
              --clear-groups \
              --no-new-privs \
              --bounding-set=-all \
            /usr/bin/env -i \
              LANG=C.UTF-8 \
              PATH=/usr/bin:/bin \
              "$PYTHON_BIN" -I -S -B "$PROMOTER" \
                --apply "$RAW_INPUT" \
                --baseline "$BASELINE" \
                --output "$SANITIZED_OUTPUT"
          sudo chown -R "$(id -u):$(id -g)" "$SANITIZED_OUTPUT"
          find "$SANITIZED_OUTPUT" -type d -exec chmod 0755 {} +
          find "$SANITIZED_OUTPUT" -type f -exec chmod 0644 {} +
          test -f "$SANITIZED_OUTPUT/sanitized-manifest.json"

      - name: Verify full sanitized contract in read-only job
        env:
          SANITIZED_OUTPUT: /tmp/animeko-sanitize-${{ github.run_id }}-${{ github.run_attempt }}/work/output
          EXPECTED_RUN_IDENTITY: github:${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python -I -S -B src/publish_discovery.py \
            --verify "$SANITIZED_OUTPUT" \
            --expected-run-identity "$EXPECTED_RUN_IDENTITY"

      - name: Upload sanitized promotion artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: animeko-sanitized-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/animeko-sanitize-${{ github.run_id }}-${{ github.run_attempt }}/work/output/sanitized-manifest.json
            /tmp/animeko-sanitize-${{ github.run_id }}-${{ github.run_attempt }}/work/output/all_animeko_links.txt
            /tmp/animeko-sanitize-${{ github.run_id }}-${{ github.run_attempt }}/work/output/discovery/state.json
            /tmp/animeko-sanitize-${{ github.run_id }}-${{ github.run_attempt }}/work/output/discovery/programs.json
            /tmp/animeko-sanitize-${{ github.run_id }}-${{ github.run_attempt }}/work/output/discovery/candidates.json
            /tmp/animeko-sanitize-${{ github.run_id }}-${{ github.run_attempt }}/work/output/discovery/redundant.json
            /tmp/animeko-sanitize-${{ github.run_id }}-${{ github.run_attempt }}/work/output/discovery/rejected.json
            /tmp/animeko-sanitize-${{ github.run_id }}-${{ github.run_attempt }}/work/output/discovery/latest.json
            /tmp/animeko-sanitize-${{ github.run_id }}-${{ github.run_attempt }}/work/output/discovery/promotion.json
          if-no-files-found: error
          overwrite: false
          retention-days: 3

      - name: Remove isolated sanitizer filesystem
        if: always()
        env:
          SANDBOX: /tmp/animeko-sanitize-${{ github.run_id }}-${{ github.run_attempt }}
        run: sudo rm -rf -- "$SANDBOX"

  publish_pr:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [sanitize, resolve_review]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout trusted publisher without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay cumulative state from the rolling review
        if: needs.resolve_review.outputs.has_open == 'true'
        env:
          REVIEW_BRANCH: ${{ needs.resolve_review.outputs.branch }}
          REVIEW_HEAD: ${{ needs.resolve_review.outputs.head_sha }}
          OVERLAY: ${{ runner.temp }}/animeko-publish-baseline
        run: |
          set -euo pipefail
          [[ "$REVIEW_BRANCH" =~ ^automation/animeko-review-[0-9]+-[0-9]+$ ]]
          [[ "$REVIEW_HEAD" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          git fetch --no-tags --depth=1 origin "+refs/heads/$REVIEW_BRANCH:refs/remotes/origin/animeko-rolling-review"
          test "$(git rev-parse refs/remotes/origin/animeko-rolling-review)" = "$REVIEW_HEAD"
          rm -rf "$OVERLAY"
          mkdir -p "$OVERLAY"
          for path in discovery/state.json discovery/programs.json; do
            entry=$(git ls-tree "$REVIEW_HEAD" -- "$path")
            [[ "$entry" == "100644 blob "* ]] || {
              echo "滚动PR发布基线文件mode或类型无效: $path"
              exit 1
            }
            output="$OVERLAY/${path##*/}"
            git show "$REVIEW_HEAD:$path" > "$output"
            test -s "$output"
            test "$(stat -c %s -- "$output")" -le 5242880
            install -m 0644 "$output" "$path"
          done

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Download sanitized artifact only
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: animeko-sanitized-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/animeko-sanitized

      - name: Verify and apply fixed sanitized files
        id: verified
        env:
          SANITIZED_INPUT: ${{ runner.temp }}/animeko-sanitized
          EXPECTED_RUN_IDENTITY: github:${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git config --local core.hooksPath /dev/null
          case "$(git remote get-url origin)" in
            "https://github.com/${{ github.repository }}"|"https://github.com/${{ github.repository }}.git") ;;
            *) echo "origin URL不可信"; exit 1 ;;
          esac
          if git config --local --get-regexp '^(http\..*\.extraheader|credential\.)'; then
            echo "publish checkout不得预置git凭据"
            exit 1
          fi
          CONFIG_HASH_BEFORE=$(sha256sum .git/config | cut -d' ' -f1)
          MANIFEST_SHA256=$(sha256sum "$SANITIZED_INPUT/sanitized-manifest.json" | cut -d' ' -f1)
          python -I -S -B -m py_compile src/animeko_url_policy.py src/publish_discovery.py
          python -I -S -B src/publish_discovery.py --test
          python -I -S -B src/publish_discovery.py \
            --apply "$SANITIZED_INPUT" \
            --expected-run-identity "$EXPECTED_RUN_IDENTITY"
          echo "manifest_sha256=$MANIFEST_SHA256" >> "$GITHUB_OUTPUT"
          echo "Sanitized manifest SHA-256: $MANIFEST_SHA256" >> "$GITHUB_STEP_SUMMARY"
          CONFIG_HASH_AFTER=$(sha256sum .git/config | cut -d' ' -f1)
          test "$CONFIG_HASH_BEFORE" = "$CONFIG_HASH_AFTER"
          test "$(git config --local core.hooksPath)" = /dev/null
          case "$(git remote get-url origin)" in
            "https://github.com/${{ github.repository }}"|"https://github.com/${{ github.repository }}.git") ;;
            *) echo "origin URL在publish后发生变化"; exit 1 ;;
          esac
          rm -rf "$SANITIZED_INPUT"

      - name: Stage and enforce publish allowlist
        id: changes
        env:
          HAS_OPEN_REVIEW: ${{ needs.resolve_review.outputs.has_open }}
        run: |
          set -euo pipefail
          allowed='^(all_animeko_links\.txt|discovery/(state|programs|candidates|redundant|rejected|latest|promotion)\.json)$'
          mapfile -d '' -t changed < <(
            { git diff --name-only -z; git ls-files --others --exclude-standard -z; }
          )
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || {
              echo "拒绝publish job修改非白名单路径: $path"
              exit 1
            }
            test -f "$path"
            test ! -L "$path"
            test -s "$path"
            test ! -x "$path"
          done
          test -s all_animeko_links.txt
          git diff --check
          if git diff --quiet -- all_animeko_links.txt; then
            echo "links_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "links_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$HAS_OPEN_REVIEW" != true ]; then
            meaningful=$(python - <<'PY'
          import json
          import pathlib
          import subprocess

          def from_head(path):
              return json.loads(subprocess.check_output(
                  ["git", "show", f"HEAD:{path}"], text=True))

          def active_state(document):
              promoted = set(document.get("promoted", []))
              candidates = {
                  url: record for url, record in document.get("candidates", {}).items()
                  if url not in promoted
              }
              return promoted, candidates

          old_state = from_head("discovery/state.json")
          new_state = json.loads(pathlib.Path("discovery/state.json").read_text())
          old_programs = from_head("discovery/programs.json")
          new_programs = json.loads(pathlib.Path("discovery/programs.json").read_text())
          identity = lambda item: f"{item['platform']}:{item['repository'].casefold()}"
          program_changed = (
              {identity(item) for item in old_programs["programs"]}
              != {identity(item) for item in new_programs["programs"]}
          )
          state_changed = active_state(old_state) != active_state(new_state)
          links_changed = subprocess.run(
              ["git", "diff", "--quiet", "--", "all_animeko_links.txt"],
              check=False).returncode != 0
          print("true" if program_changed or state_changed or links_changed else "false")
          PY
            )
            if [ "$meaningful" != true ]; then
              echo "没有新的未确认成果，跳过创建新滚动PR"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -- \
            all_animeko_links.txt \
            discovery/state.json \
            discovery/programs.json \
            discovery/candidates.json \
            discovery/redundant.json \
            discovery/rejected.json \
            discovery/latest.json \
            discovery/promotion.json
          if git diff --cached --summary | grep -E 'mode change|create mode 120000'; then
            echo "拒绝文件模式或符号链接变化"
            exit 1
          fi
          while IFS= read -r -d '' entry; do
            mode=${entry%% *}
            test "$mode" = 100644 || {
              echo "拒绝非100644 staged mode: $entry"
              exit 1
            }
          done < <(git ls-files -s -z -- \
            all_animeko_links.txt \
            discovery/state.json \
            discovery/programs.json \
            discovery/candidates.json \
            discovery/redundant.json \
            discovery/rejected.json \
            discovery/latest.json \
            discovery/promotion.json)
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update the single rolling discovery pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
          HAS_OPEN_REVIEW: ${{ needs.resolve_review.outputs.has_open }}
          REVIEW_NUMBER: ${{ needs.resolve_review.outputs.number }}
          REVIEW_BRANCH: ${{ needs.resolve_review.outputs.branch }}
          REVIEW_HEAD: ${{ needs.resolve_review.outputs.head_sha }}
          NEW_BRANCH: automation/animeko-review-${{ github.run_id }}-${{ github.run_attempt }}
          PUBLISH_STAGE: ${{ runner.temp }}/animeko-rolling-publish-${{ github.run_id }}-${{ github.run_attempt }}
          CURRENT_LINKS: ${{ runner.temp }}/animeko-current-links-${{ github.run_id }}-${{ github.run_attempt }}.txt
          EXISTING_LINKS: ${{ runner.temp }}/animeko-existing-links-${{ github.run_id }}-${{ github.run_attempt }}.txt
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          [[ "$TRIGGER_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          remote_main=$(git ls-remote --exit-code origin \
            "refs/heads/${{ github.event.repository.default_branch }}" | cut -f1)
          [ "$remote_main" = "$TRIGGER_SHA" ] || {
            echo "main在本轮验证期间已经变化；等待下一轮基于新main重算"
            exit 1
          }

          rm -rf "$PUBLISH_STAGE"
          mkdir -p "$PUBLISH_STAGE/discovery"
          install -m 0644 all_animeko_links.txt "$PUBLISH_STAGE/all_animeko_links.txt"
          for name in state programs candidates redundant rejected latest promotion; do
            install -m 0644 "discovery/$name.json" "$PUBLISH_STAGE/discovery/$name.json"
          done
          trap 'rm -rf -- "$PUBLISH_STAGE"; rm -f -- "$CURRENT_LINKS" "$EXISTING_LINKS"' EXIT

          if [ "$HAS_OPEN_REVIEW" = true ]; then
            [[ "$REVIEW_NUMBER" =~ ^[0-9]+$ ]]
            [[ "$REVIEW_BRANCH" =~ ^automation/animeko-review-[0-9]+-[0-9]+$ ]]
            [[ "$REVIEW_HEAD" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
            remote_review=$(git ls-remote --exit-code origin "refs/heads/$REVIEW_BRANCH" | cut -f1)
            [ "$remote_review" = "$REVIEW_HEAD" ] || {
              echo "滚动PR在本轮分析期间已更新；拒绝覆盖，等待下一轮"
              exit 1
            }
            mapfile -t review_files < <(
              gh api --paginate "repos/$REPOSITORY/pulls/$REVIEW_NUMBER/files?per_page=100" \
                --jq '.[].filename' | LC_ALL=C sort -u
            )
            allowed='^(all_animeko_links\.txt|discovery/(state|programs|candidates|redundant|rejected|latest|promotion)\.json)$'
            for path in "${review_files[@]}"; do
              [[ "$path" =~ $allowed ]] || {
                echo "滚动PR含非白名单文件，拒绝自动更新: $path"
                exit 1
              }
            done

            git reset --hard HEAD
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --unshallow origin
            else
              git fetch origin
            fi
            git fetch origin "+refs/heads/$REVIEW_BRANCH:refs/remotes/origin/animeko-rolling-review"
            test "$(git rev-parse refs/remotes/origin/animeko-rolling-review)" = "$REVIEW_HEAD"
            git switch -C "animeko-review-update-${{ github.run_id }}-${{ github.run_attempt }}" \
              refs/remotes/origin/animeko-rolling-review
            git merge --no-edit "refs/remotes/origin/${{ github.event.repository.default_branch }}"

            cp --no-dereference -- all_animeko_links.txt "$EXISTING_LINKS"
            git show \
              "refs/remotes/origin/${{ github.event.repository.default_branch }}:all_animeko_links.txt" \
              > "$CURRENT_LINKS"
            for name in state programs candidates redundant rejected latest promotion; do
              install -m 0644 "$PUBLISH_STAGE/discovery/$name.json" "discovery/$name.json"
            done
            python -I -S -B src/publish_discovery.py --merge-pending-links \
              "$CURRENT_LINKS" "$EXISTING_LINKS" "$PUBLISH_STAGE/all_animeko_links.txt" \
              all_animeko_links.txt
            chmod 0644 all_animeko_links.txt
            git diff --check
            git add -- \
              all_animeko_links.txt \
              discovery/state.json \
              discovery/programs.json \
              discovery/candidates.json \
              discovery/redundant.json \
              discovery/rejected.json \
              discovery/latest.json \
              discovery/promotion.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: 累计 Animeko 搜索成果 $(date -u +%F)"
              git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
            fi
            gh pr edit "$REVIEW_NUMBER" \
              --body "确认前，每轮只读搜索成果都会累计到此同一个PR；确认合并后，已确认历史不会再作为新成果拉起。最新Sanitized manifest SHA-256: ${{ steps.verified.outputs.manifest_sha256 }}。"
            echo "已累计更新滚动Discovery PR #$REVIEW_NUMBER"
            exit 0
          fi

          git commit -m "chore: 开始累计 Animeko 搜索成果 $(date -u +%F)"
          git switch -c "$NEW_BRANCH"
          git push origin "HEAD:refs/heads/$NEW_BRANCH"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$NEW_BRANCH" \
            --title "chore: 确认 Animeko 累计搜索成果" \
            --body "确认前，每轮只读搜索成果都会累计到此同一个PR；确认合并后，已确认历史不会再作为新成果拉起。Sanitized manifest SHA-256: ${{ steps.verified.outputs.manifest_sha256 }}。"
