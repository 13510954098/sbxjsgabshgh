name: Update Sources

on:
  schedule:
    # 每 4 小时自动更新一次（UTC 时间）
    - cron: "0 */4 * * *"
  workflow_dispatch: # 也可在 Actions 页面手动点击运行

concurrency: # 避免定时与手动任务并发推送
  group: update-sources
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # [修6] 最坏抓取 ~21 分钟，15 分钟不够
    steps:
      # 固定 commit SHA；persist-credentials 默认 true：
      # checkout 自动把 GITHUB_TOKEN 写入 git 凭据，push 直接复用
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "requests==2.32.5"

      - name: Run selftests
        run: python update_sources.py --test

      - name: Run update
        run: python update_sources.py
        env: # [修4] 显式传入 token：脚本用它对 GitHub API 解析 commit SHA 快照
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate outputs
        run: python update_sources.py --validate

      - name: Upload report as artifact
        # [修9] 固定 commit SHA（v4.4.3）
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        if: always()
        with:
          name: latest-report
          path: reports/latest.json
          if-no-files-found: ignore

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ log update_sources.py all_animeko_links.txt .gitignore
          if ! git diff --cached --quiet; then
            git commit -m "Update sources $(date -u +'%Y-%m-%d %H:%M UTC')"
            git fetch origin
            git rebase origin/main
            git push
            echo "已提交更新"
          else
            echo "无变化，跳过提交"
          fi
