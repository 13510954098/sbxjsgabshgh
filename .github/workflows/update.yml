name: Update Sources

on:
  schedule:
    # 每 4 小时自动更新一次（UTC 时间）
    - cron: "0 */4 * * *"
  workflow_dispatch: # 也可在 Actions 页面手动点击运行

concurrency: # 避免定时与手动任务并发推送
  group: update-sources
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # [修6] 最坏抓取 ~21 分钟，15 分钟不够
    steps:
      # [升1] checkout v5.0.1（Node 24）
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      # [升2] setup-python v6.0.0（Node 24）
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "requests==2.32.5"

      - name: Run selftests
        run: python update_sources.py --test

      - name: Run update
        run: python update_sources.py
        env: # [修4] 显式传入 token：脚本用它对 GitHub API 解析 commit SHA 快照
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate outputs
        run: python update_sources.py --validate

      - name: Upload report as artifact
        # [升3] upload-artifact v6.0.0（Node 24，需 runner ≥2.327.1）
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: latest-report
          path: |
            reports/latest.json
            log                                      # [优1] 日志走 artifact
          if-no-files-found: ignore

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f log                                   # [优1] artifact 已留档，删除即不入库，首次运行自动清历史
          git add -A                                  # [优3] 自动收全交付物
          if ! git diff --cached --quiet; then
            git commit -m "Update sources $(date -u +'%Y-%m-%d %H:%M UTC')"
            git fetch origin
            git rebase origin/main
            git push
            echo "已提交更新"
          else
            echo "无变化，跳过提交"
          fi
