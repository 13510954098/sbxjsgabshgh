name: Update Animeko Sources

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - src/animeko_url_policy.py
      - src/update_sources.py
      - src/requirements-discovery.lock
      - all_animeko_links.txt
      - canonical_links.json
      - editorial/tiers.json
      - quality/tier-overrides.json
      - .github/workflows/update.yml
      - .gitignore

concurrency:
  group: update-animeko-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Harden Git checkout
        run: |
          set -euo pipefail
          git config --local core.hooksPath /dev/null
          test "$(git config --local core.hooksPath)" = /dev/null
          if git config --local --get-regexp '^(http\..*\.extraheader|credential\.)'; then
            echo "checkout不得预置git凭据"
            exit 1
          fi
          case "$(git remote get-url origin)" in
            "https://github.com/${{ github.repository }}"|"https://github.com/${{ github.repository }}.git") ;;
            *) echo "origin URL不可信"; exit 1 ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r src/requirements-discovery.lock
          python - <<'PY'
          import requests
          import urllib3
          assert requests.__version__ == "2.34.2", requests.__version__
          assert urllib3.__version__ == "2.7.0", urllib3.__version__
          PY

      - name: Compile updater
        run: python -m py_compile src/animeko_url_policy.py src/update_sources.py

      - name: Verify Java runtime
        run: java -version

      - name: Run updater selftests
        run: python src/update_sources.py --test

      - name: Restore cache bound to checked-out dist
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: cache/
          key: animeko-fetch-v4-${{ hashFiles('dist/latest.json') }}-${{ github.run_id }}
          restore-keys: |
            animeko-fetch-v4-${{ hashFiles('dist/latest.json') }}-

      - name: Run updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/update_sources.py

      - name: Validate generated outputs
        run: python src/update_sources.py --validate

      - name: Enforce integrity and transaction result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          report_path = pathlib.Path("reports/latest.json")
          if not report_path.is_file():
              raise SystemExit("reports/latest.json 缺失")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          level = report.get("integrity_level")
          changed = report.get("changed")
          if level not in {"strict", "degraded"}:
              raise SystemExit(f"完整性等级非法: {level!r}")
          if level == "degraded" and changed is not False:
              raise SystemExit("degraded 运行不得标记 changed=true")
          diff = subprocess.run(["git", "diff", "--quiet", "--", "dist/"], check=False)
          if level == "degraded" and diff.returncode != 0:
              raise SystemExit("degraded 运行修改了 dist/")
          if pathlib.Path("dist/.txn-pending").exists():
              raise SystemExit("检测到未完成事务 dist/.txn-pending")
          leftovers = list(pathlib.Path(".").glob("dist.new-*")) + list(pathlib.Path(".").glob("dist.bak-*"))
          if leftovers:
              raise SystemExit(f"检测到事务残留: {leftovers}")
          print(f"integrity={level}, changed={changed}, dist_diff={diff.returncode != 0}")
          PY

      - name: Save accepted fetch cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: cache/
          key: animeko-fetch-v4-${{ hashFiles('dist/latest.json') }}-${{ github.run_id }}

      - name: Create updater pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automation/animeko-update-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if git diff --quiet -- dist/ && git diff --quiet --cached -- dist/; then
            echo "dist/ 无变化，跳过PR"
            exit 0
          fi
          python - <<'PY'
          import json
          report = json.load(open("reports/latest.json", encoding="utf-8"))
          if report.get("integrity_level") != "strict":
              raise SystemExit("只有 strict 运行可以创建更新PR")
          if report.get("changed") is not True:
              raise SystemExit("dist/ 有变化但报告 changed 不是 true")
          PY
          allowed='^dist/(all|online|bt|all-name|online-name|bt-name|latest)\.json$|^dist/log$'
          mapfile -d '' -t changed < <(
            { git diff --name-only -z -- dist/; git ls-files --others --exclude-standard -z -- dist/; }
          )
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || {
              echo "拒绝updater修改非白名单路径: $path"
              exit 1
            }
            test -f "$path"
            test ! -L "$path"
            test -s "$path"
            test ! -x "$path"
          done
          existing_pr=$(gh pr list \
            --state open \
            --base "${{ github.event.repository.default_branch }}" \
            --limit 100 \
            --json number,headRefName,headRepositoryOwner \
            --jq '[.[] | select(.headRepositoryOwner.login == "${{ github.repository_owner }}") | select(.headRefName | startswith("automation/animeko-update-"))][0].number // empty')
          if [ -n "$existing_pr" ]; then
            echo "已有待审核updater PR #$existing_pr，本次不创建重复PR"
            exit 0
          fi
          git diff --check -- dist/
          git add -- dist/
          if git diff --cached --summary | grep -E 'mode change|create mode 120000'; then
            echo "拒绝dist文件mode或symlink变化"
            exit 1
          fi
          while IFS= read -r -d '' entry; do
            mode=${entry%% *}
            test "$mode" = 100644 || {
              echo "拒绝非100644 staged mode: $entry"
              exit 1
            }
          done < <(git ls-files -s -z -- dist/)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 更新聚合源产物 $(date -u +%F)"
          git switch -c "$BRANCH_NAME"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH_NAME" \
            --title "chore: 更新聚合源产物 $(date -u +%F)" \
            --body "Updater 已通过 strict integrity、事务残留、固定路径与mode检查。请审核 dist/ diff 后合并。"

      - name: Upload updater report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: update-report-${{ github.run_id }}
          path: reports/latest.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
