name: Update Animeko Sources

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - update_sources.py
      - all_animeko_links.txt

concurrency:
  group: update-animeko
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install "requests==2.32.5"

      - name: Restore fetch cache
        uses: actions/cache/restore@v6
        with:
          path: cache/
          key: fetch-cache-${{ github.run_id }}
          restore-keys: |
            fetch-cache-

      - name: Run updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_sources.py

      - name: Save fetch cache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: cache/
          key: fetch-cache-${{ github.run_id }}

      - name: Commit dist/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- dist/ && git diff --quiet --cached -- dist/; then
            echo "dist/ 无变化，跳过提交"
          else
            git add dist/
            git commit -m "chore: 更新聚合源产物 $(date -u +%F)"
            for i in 1 2 3; do
              if git push; then break; fi
              echo "push 失败，拉取远端后重试 ($i/3)"
              git pull --rebase || true
            done
          fi

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: update-report
          path: reports/latest.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
