name: Update Animeko Sources

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - src/animeko_url_policy.py
      - src/update_sources.py
      - src/requirements-discovery.lock
      - all_animeko_links.txt
      - canonical_links.json
      - editorial/tiers.json
      - quality/tier-overrides.json
      - .github/workflows/update.yml
      - .gitignore

concurrency:
  group: update-animeko-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Harden Git checkout
        run: |
          set -euo pipefail
          git config --local core.hooksPath /dev/null
          test "$(git config --local core.hooksPath)" = /dev/null
          if git config --local --get-regexp '^(http\..*\.extraheader|credential\.)'; then
            echo "checkout不得预置git凭据"
            exit 1
          fi
          case "$(git remote get-url origin)" in
            "https://github.com/${{ github.repository }}"|"https://github.com/${{ github.repository }}.git") ;;
            *) echo "origin URL不可信"; exit 1 ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r src/requirements-discovery.lock
          python - <<'PY'
          import requests
          import urllib3
          assert requests.__version__ == "2.34.2", requests.__version__
          assert urllib3.__version__ == "2.7.0", urllib3.__version__
          PY

      - name: Compile updater
        run: python -m py_compile src/animeko_url_policy.py src/update_sources.py

      - name: Verify Java runtime
        run: java -version

      - name: Run updater selftests
        run: python src/update_sources.py --test

      - name: Restore cache bound to checked-out dist
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: cache/
          key: animeko-fetch-v4-${{ hashFiles('dist/latest.json') }}-${{ github.run_id }}
          restore-keys: |
            animeko-fetch-v4-${{ hashFiles('dist/latest.json') }}-

      - name: Run updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/update_sources.py

      - name: Explain updater abort
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          report_path = pathlib.Path("reports/latest.json")
          if not report_path.is_file():
              raise SystemExit("reports/latest.json 缺失，无法生成中止摘要")
          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except ValueError as exc:
              raise SystemExit(f"reports/latest.json 解析失败: {exc}")
          reason = report.get("aborted_reason")
          if not reason:
              raise SystemExit("本次失败不是 updater 主动中止，跳过摘要")

          failed = report.get("failed") or {}
          stale = report.get("stale_reasons") or {}
          lines = [
              "### Update 中止摘要",
              "",
              f"- 中止原因：`{reason}`",
              f"- 完整性等级：`{report.get('integrity_level')}`"
              f"（{report.get('integrity_reasons')}）",
              f"- 上游：fresh {report.get('valid_sources_fresh')} /"
              f" stale {report.get('valid_sources_stale')} /"
              f" 硬失败 {len(failed)} / 共 {report.get('groups')}",
              "",
          ]
          if failed:
              lines.append(f"#### 硬失败上游（{len(failed)}）")
              for canon, meta in sorted(failed.items())[:25]:
                  meta = meta or {}
                  lines.append(f"- `{canon}` → `{meta.get('error')}`")
                  # Without these, `fresh-content-invalid` says only "the body was
                  # rejected" and the actual field never reaches anyone: the report
                  # artifact is gitignored and has repeatedly been undownloadable.
                  for detail in (meta.get("parse_diagnostics") or [])[:6]:
                      lines.append(f"  - `{detail}`")
              lines.append("")
          if stale:
              lines.append(f"#### stale 缓存兜底（{len(stale)}）")
              lines += [f"- `{canon}` → `{why}`" for canon, why in sorted(stale.items())[:25]]
              lines.append("")
          body = "\n".join(lines)
          print(body, flush=True)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as out:
                  out.write(body + "\n")

          title = "⚠️ Update 中止：上游抓取不完整"
          opened = subprocess.run(
              ["gh", "issue", "list", "--repo", os.environ["GH_REPO"],
               "--state", "open", "--search", "Update 中止 in:title",
               "--json", "number", "--limit", "5"],
              capture_output=True, text=True, check=False,
          )
          try:
              existing = json.loads(opened.stdout or "[]")
          except ValueError:
              existing = []
          if opened.returncode == 0 and not existing:
              subprocess.run(
                  ["gh", "issue", "create", "--repo", os.environ["GH_REPO"],
                   "--title", title,
                   "--body", body + f"\n- 运行详情：{os.environ['RUN_URL']}\n\n"
                   "上游恢复后本 issue 可直接关闭；若某个源已长期死亡，"
                   "请从 all_animeko_links.txt 移除或更换镜像。"],
                  check=False,
              )
          PY

      - name: Validate generated outputs
        run: python src/update_sources.py --validate

      - name: Enforce integrity and transaction result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          report_path = pathlib.Path("reports/latest.json")
          if not report_path.is_file():
              raise SystemExit("reports/latest.json 缺失")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          level = report.get("integrity_level")
          changed = report.get("changed")
          if level not in {"strict", "tolerated", "degraded"}:
              raise SystemExit(f"完整性等级非法: {level!r}")
          if level == "degraded" and changed is not False:
              raise SystemExit("degraded 运行不得标记 changed=true")
          diff = subprocess.run(["git", "diff", "--quiet", "--", "dist/"], check=False)
          if level == "degraded" and diff.returncode != 0:
              raise SystemExit("degraded 运行修改了 dist/")
          if pathlib.Path("dist/.txn-pending").exists():
              raise SystemExit("检测到未完成事务 dist/.txn-pending")
          leftovers = list(pathlib.Path(".").glob("dist.new-*")) + list(pathlib.Path(".").glob("dist.bak-*"))
          if leftovers:
              raise SystemExit(f"检测到事务残留: {leftovers}")
          print(f"integrity={level}, changed={changed}, dist_diff={diff.returncode != 0}")
          PY

      - name: Save accepted fetch cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: cache/
          key: animeko-fetch-v4-${{ hashFiles('dist/latest.json') }}-${{ github.run_id }}

      - name: Enforce publish guard fuses
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if git diff --quiet -- dist/ && git diff --cached --quiet -- dist/; then
            echo "dist/ 无变化，跳过发布" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json
          report = json.load(open("reports/latest.json", encoding="utf-8"))
          if report.get("integrity_level") not in {"strict", "tolerated"}:
              raise SystemExit("只有 strict/tolerated 运行可以发布到 main")
          if report.get("changed") is not True:
              raise SystemExit("dist/ 有变化但报告 changed 不是 true")
          PY
          allowed='^dist/(all|online|bt|all-name|online-name|bt-name|latest)\.json$|^dist/log$'
          mapfile -d '' -t changed < <(
            { git diff --name-only -z -- dist/; git ls-files --others --exclude-standard -z -- dist/; }
          )
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || {
              echo "拒绝updater修改非白名单路径: $path"
              exit 1
            }
            test -f "$path"
            test ! -L "$path"
            test -s "$path"
            test ! -x "$path"
          done
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          DROP_FUSE = 0.30        # 单产物萎缩超过30% → 熔断
          GROW_FUSE = 0.50        # 单产物膨胀超过50% → 熔断
          TOTAL_DROP_FUSE = 0.25  # 受保护产物合计萎缩超过25% → 熔断
          PROTECTED = ("dist/all.json", "dist/online.json", "dist/bt.json")

          def metric(raw: bytes) -> int:
              try:
                  obj = json.loads(raw)
              except ValueError:
                  return len(raw)
              node = obj
              # Animeko 产物 schema: {"exportedMediaSourceDataList": {"mediaSources": [...]}}
              for key in ("exportedMediaSourceDataList", "mediaSources"):
                  if isinstance(node, dict) and key in node:
                      node = node[key]
              if isinstance(node, list):
                  return len(node)
              if isinstance(node, dict):
                  return len(node)
              return len(raw)

          trips = []
          lines = ["| 产物 | 基线 | 本次 | 比例 |", "|---|---|---|---|"]
          total_old = 0
          total_new = 0
          for path in PROTECTED:
              current = pathlib.Path(path)
              if not current.is_file():
                  continue
              baseline = subprocess.run(
                  ["git", "show", f"HEAD:{path}"], capture_output=True, check=False
              )
              if baseline.returncode != 0:
                  lines.append(f"| {path} | 无基线 | - | - |")
                  continue
              old = metric(baseline.stdout)
              new = metric(current.read_bytes())
              if old <= 0:
                  continue
              total_old += old
              total_new += new
              ratio = new / old
              lines.append(f"| {path} | {old} | {new} | {ratio:.1%} |")
              if ratio < 1 - DROP_FUSE:
                  trips.append(f"{path} 萎缩至 {ratio:.1%}")
              if ratio > 1 + GROW_FUSE:
                  trips.append(f"{path} 膨胀至 {ratio:.1%}")
          if total_old > 0:
              total_ratio = total_new / total_old
              lines.append(f"| **合计** | {total_old} | {total_new} | {total_ratio:.1%} |")
              if total_ratio < 1 - TOTAL_DROP_FUSE:
                  trips.append(f"出货总量萎缩至 {total_ratio:.1%}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("### 出货量熔断检查\n\n" + "\n".join(lines) + "\n")
          if trips:
              detail = "；".join(trips)
              print(f"::error::Update 熔断器触发：{detail} —— 已拒绝直推 main", flush=True)
              opened = subprocess.run(
                  ["gh", "issue", "list", "--repo", os.environ["GH_REPO"],
                   "--state", "open", "--search", "Update 熔断 in:title",
                   "--json", "number", "--limit", "5"],
                  capture_output=True, text=True, check=False,
              )
              try:
                  existing = json.loads(opened.stdout or "[]")
              except ValueError:
                  existing = []
              if opened.returncode == 0 and not existing:
                  subprocess.run(
                      ["gh", "issue", "create", "--repo", os.environ["GH_REPO"],
                       "--title", "⚠️ Update 熔断：出货量异常，已暂停直推",
                       "--body",
                       "熔断器在发布前拦下了一次异常聚合。\n\n"
                       f"- 触发原因：{detail}\n"
                       f"- 运行详情：{os.environ['RUN_URL']}\n\n"
                       "请人工核对上游源状况。确认数据正常后 Re-run 该 workflow 可放行。"],
                      check=False,
                  )
              sys.exit(1)
          print("熔断器通过: " + "; ".join(lines[2:]))
          PY
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish guarded artifacts via instant auto-merge
        if: steps.guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$TRIGGER_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          git diff --check -- dist/
          payload="${{ runner.temp }}/animeko-dist-payload"
          if [ -e "$payload" ] || [ -L "$payload" ]; then
            echo "payload 路径已被占用"
            exit 1
          fi
          mkdir -p "$payload"
          cp -a dist/. "$payload/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          attempt=0
          while [ "$attempt" -lt 3 ]; do
            attempt=$((attempt + 1))
            git fetch --depth 1 origin \
              "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            git switch -C animeko-publish "refs/remotes/origin/$DEFAULT_BRANCH"
            test ! -L dist
            rm -rf -- dist
            mkdir dist
            cp -a "$payload/." dist/
            allowed='^dist/(all|online|bt|all-name|online-name|bt-name|latest)\.json$|^dist/log$'
            mapfile -d '' -t changed < <(
              { git diff --name-only -z -- dist/; git ls-files --others --exclude-standard -z -- dist/; }
            )
            for path in "${changed[@]}"; do
              [[ "$path" =~ $allowed ]] || {
                echo "拒绝updater修改非白名单路径: $path"
                exit 1
              }
              test -f "$path"
              test ! -L "$path"
              test -s "$path"
              test ! -x "$path"
            done
            git add -- dist/
            if git diff --cached --quiet; then
              echo "main 已包含相同产物，本轮无需发布"
              exit 0
            fi
            if git diff --cached --summary | grep -E 'mode change|create mode 120000'; then
              echo "拒绝dist文件mode或symlink变化"
              exit 1
            fi
            while IFS= read -r -d '' entry; do
              mode=${entry%% *}
              test "$mode" = 100644 || {
                echo "拒绝非100644 staged mode: $entry"
                exit 1
              }
            done < <(git ls-files -s -z -- dist/)
            git commit -q -m "chore: 更新聚合源产物 $(date -u +%F)"
            branch="animeko-micro/${RUN_ID}-${attempt}"
            git push origin "HEAD:refs/heads/$branch"
            # 规则集 Protect main 要求一切变更走 PR：开微型PR并在同一步内立即自合并
            if gh pr create --base "$DEFAULT_BRANCH" --head "$branch" \
                 --title "chore: 更新聚合源产物 $(date -u +%F)" \
                 --body "熔断器通过后的自动发布通道（微型PR，立即自合并，请勿人工处理）。" \
                 && gh pr merge "$branch" --merge --delete-branch; then
              echo "已通过微型PR自合并发布（第 $attempt 次尝试）" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "微型PR发布失败，清理后重试（$attempt/3）"
            gh pr close "$branch" --delete-branch || true
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$branch" || true
          done
          echo "连续3次发布竞争失败，放弃本轮；下个周期会基于新 main 重算"
          exit 1

      - name: Resolve abort issue after a healthy run
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess

          # "Explain updater abort" opens this issue when the updater stops; nothing
          # closed it on recovery, so it outlived the incident it described.
          listed = subprocess.run(
              ["gh", "issue", "list", "--repo", os.environ["GH_REPO"],
               "--state", "open", "--search", "Update 中止 in:title",
               "--json", "number", "--limit", "5"],
              capture_output=True, text=True, check=False,
          )
          if listed.returncode != 0:
              raise SystemExit(f"查询 issue 失败，跳过：{listed.stderr.strip()}")
          try:
              open_issues = json.loads(listed.stdout or "[]")
          except ValueError:
              raise SystemExit("issue 列表解析失败，跳过")
          for issue in open_issues:
              number = str(issue.get("number"))
              subprocess.run(
                  ["gh", "issue", "close", number, "--repo", os.environ["GH_REPO"],
                   "--comment", f"本轮 Update 已完整成功，上游抓取恢复，自动关闭。\n\n"
                   f"- 运行详情：{os.environ['RUN_URL']}"],
                  check=False,
              )
              print(f"已关闭 issue #{number}", flush=True)
          PY

      - name: Warn on upstream schema drift
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          TITLE = "⚠️ 上游 schema 漂移预警"
          SEARCH = "schema 漂移 in:title"

          report_path = pathlib.Path("reports/latest.json")
          if not report_path.is_file():
              print("reports/latest.json 缺失，跳过漂移检查")
              raise SystemExit(0)
          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except ValueError as exc:
              print(f"reports/latest.json 解析失败，跳过漂移检查: {exc}")
              raise SystemExit(0)
          drift = report.get("schema_drift") or {}

          listed = subprocess.run(
              ["gh", "issue", "list", "--repo", os.environ["GH_REPO"],
               "--state", "open", "--search", SEARCH, "--json", "number", "--limit", "5"],
              capture_output=True, text=True, check=False,
          )
          try:
              open_issues = json.loads(listed.stdout or "[]") if listed.returncode == 0 else []
          except ValueError:
              open_issues = []

          if not drift:
              # Upstream came back in line (or we widened the allowlist): retract.
              for issue in open_issues:
                  subprocess.run(
                      ["gh", "issue", "close", str(issue.get("number")),
                       "--repo", os.environ["GH_REPO"],
                       "--comment", f"本轮未再检测到未知字段，漂移已消除，自动关闭。\n\n"
                       f"- 运行详情：{os.environ['RUN_URL']}"],
                      check=False,
                  )
                  print(f"漂移已消除，关闭 issue #{issue.get('number')}")
              print("无 schema 漂移")
              raise SystemExit(0)

          lines = [
              "### 上游 schema 漂移预警",
              "",
              "上游下发了白名单里没有的字段。相关源**本轮仍在正常出货**，这是预警而非故障——",
              "但带新字段的条目一旦超过 10%，整源就会被判 `fresh-content-invalid`，",
              "2026-10 的四天停摆就是这样开始的。请核对后扩充白名单。",
              "",
          ]
          for canon, signals in sorted(drift.items()):
              lines.append(f"- `{canon}`")
              lines += [f"  - {signal}" for signal in signals[:8]]
          body = "\n".join(lines)
          print(body, flush=True)
          print(f"::warning::上游 schema 漂移：{len(drift)} 个源出现未知字段，详见 step summary")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as out:
                  out.write(body + "\n")

          # One standing issue: opened when drift appears, closed when it clears,
          # never commented on in between — this workflow runs every 4 hours.
          if open_issues:
              print(f"漂移预警 issue 已存在（#{open_issues[0].get('number')}），不重复创建")
          else:
              subprocess.run(
                  ["gh", "issue", "create", "--repo", os.environ["GH_REPO"],
                   "--title", TITLE,
                   "--body", body + f"\n- 运行详情：{os.environ['RUN_URL']}\n\n"
                   "白名单位置：`ALLOWED_ITEM_FIELDS` / `ALLOWED_ARGUMENT_FIELDS` / "
                   "`ALLOWED_SEARCH_CONFIG_FIELDS`（src/update_sources.py）。"],
                  check=False,
              )
              print("已创建漂移预警 issue")
          PY

      - name: Upload updater report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: update-report-${{ github.run_id }}
          path: reports/latest.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
