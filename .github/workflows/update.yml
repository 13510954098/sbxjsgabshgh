name: Update Animeko Sources

on:
  workflow_dispatch:
  schedule:
    # 每 6 小时运行一次，时间为 UTC
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-animeko-sources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.5 packaging

      - name: Restore script cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: animeko-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            animeko-cache-${{ runner.os }}-

      - name: Run self tests
        run: |
          python update_sources.py --test

      - name: Update sources
        run: |
          python update_sources.py

      - name: Validate dist outputs
        run: |
          python update_sources.py --validate

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist .gitignore

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update Animeko sources"
            git pull --rebase
            git push
          fi

      - name: Save script cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: animeko-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animeko-update-reports
          path: reports
          if-no-files-found: ignore
          retention-days: 7
