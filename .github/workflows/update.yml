name: Update Animeko Sources

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 18:00 运行；北京时间约次日 02:00
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: update-animeko-sources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java for regex validation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore script cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: animeko-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            animeko-cache-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests==2.32.5" packaging

      - name: Run self tests
        run: |
          python update_sources.py --test

      - name: Update sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python update_sources.py

      - name: Validate outputs
        run: |
          python update_sources.py --validate

      - name: Save script cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: animeko-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist .gitignore

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update Animeko sources"
          git push
